<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eB Lists</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./vendor/vanillagrid.css">
    <link rel="stylesheet" href="./app.css">
</head>
<body>
    <div id="shell" class="eb-shell">
        <header id="header" class="eb-header">
            <div class="eb-header-inner">
                <div class="eb-brand">eB Lists</div>
                <div class="eb-app-name">Holon Workspace</div>
                <div class="eb-header-spacer"></div>
                <div
                    class="cf-build-status"
                    title="Cloudflare deployment status"
                >
                    <span class="cf-build-dot">●</span>
                    <span>CF: deployed</span>
                </div>
                <div class="eb-row" id="headerAuth" hidden>
                    <strong id="user"></strong>
                    <button id="signOut" type="button">Sign out</button>
                </div>
            </div>
        </header>

        <div class="eb-navigation">
            <nav class="eb-tree" aria-label="Holon tree">
                <div class="tree-controls">
                    <label>
                        Root
                        <select id="treeRoot"></select>
                    </label>
                    <label>
                        Relationship
                        <select id="treeRelationship"></select>
                    </label>
                </div>
                <div id="treeGrid" aria-label="Holon tree"></div>
            </nav>

            <main class="eb-main">
                <div id="subheader" class="eb-subheader">
                    Sign in to open the Holon Workspace
                </div>

                <section id="auth" class="card">
                    <h2>Sign in</h2>
                    <input
                        id="email"
                        type="email"
                        placeholder="Email"
                        autocomplete="email"
                    >
                    <input
                        id="password"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                    >
                    <div>
                        <button id="signIn" type="button">Sign in</button>
                        <button id="signUp" type="button">Create account</button>
                    </div>
                </section>

                <section id="app" class="card" hidden>
                    <div class="workspace-grid">
                        <section class="panel">
                            <h3>Holons</h3>
                            <div id="grid" aria-label="Holons"></div>
                        </section>

                        <section class="panel">
                            <h3 id="activeList">Relationships</h3>
                            <div class="muted" id="listMode"></div>
                            <div
                                id="detailGrid"
                                aria-label="Relationships"
                            ></div>
                        </section>
                    </div>
                </section>

                <p id="status" class="muted"></p>
            </main>
        </div>
    </div>

    <script src="./vendor/vanillagrid.js"></script>
    <script type="module" src="./app.js"></script>
    <script>
        const app = document.getElementById('app');
        const headerAuth = document.getElementById('headerAuth');

        const syncHeaderAuth = () =>
        {
            headerAuth.hidden = app.hidden;
        };

        new MutationObserver(syncHeaderAuth).observe(app,
        {
            attributes: true,
            attributeFilter: ['hidden']
        });

        syncHeaderAuth();
    </script>
</body>
</html>
