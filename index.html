<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eB Lists</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./vendor/vanillagrid.css">
<link rel="icon" href="./favicon.png">
</head>
<body>
<div id="shell" class="eb-shell">
    <header class="eb-header">
      <div class="eb-header-inner">
        <div class="eb-header-refresh"><button id="refresh" type="button">↻</button></div>
        <div class="eb-row"><strong>eB Lists</strong><span class="muted">Holon Workspace</span></div>
        <div class="eb-row">
          <section id="authout" class="signoutcard">
            <strong id="user"></strong><button id="signOut" type="button">Sign out</button>
          </section>
        </div>
      </div>
      <section id="authin" class="signincard">
        <form id="authForm">
          <input id="email" type="email" placeholder="Email" autocomplete="email">
          <input id="password" type="password" placeholder="Password" autocomplete="current-password">
          <button id="signIn" type="button">Sign in</button>
          <button id="signUp" type="button">Create account</button>
        </form>
      </section>
    </header>

  <div class="eb-navigation">
    <nav id="tree" class="eb-tree" aria-label="Holon tree"></nav>
    <main class="eb-main">
      <section id="app" class="card" hidden>
        <div class="toolbar">
          <strong>Holon Workspace</strong>
          <span class="muted">Select a Holon in the tree.</span>
        </div>
        <div id="lists"></div>
        <div id="listView" hidden>
          <h2 id="activeList"></h2>
          <div class="muted" id="listMode"></div>
          <ul id="items" class="items"></ul>
        </div>
      </section>
      <p id="status" class="status muted"></p>
    </main>
  </div>
</div>
<script src="./vendor/vanillagrid.js"></script>
<script src="./app.js"></script>
</body>
</html>
