<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eB Lists</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/emptinessbliss15-cell/eBliss-Theme@017c0421fd4800cd5c63b743aacac925f7e62e41/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="eb-container">
<h1>eB Lists</h1>
<p class="eb-muted">One eBliss identity → many apps.</p>
<section id="auth" class="eb-card">
<h2>Sign in</h2>
<div class="eb-row">
<input id="email" type="email" placeholder="Email" autocomplete="email">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
</div>
<div class="eb-row"><button id="signIn">Sign in</button><button id="signUp" class="secondary">Create account</button></div>
</section>
<section id="app" class="eb-card" hidden>
<div class="eb-spread"><strong id="user"></strong> <button id="signOut" class="secondary">Sign out</button></div>
<h2>Lists</h2>
<div class="eb-row"><input id="listName" placeholder="New list name"><button id="newList">Create list</button></div>
<ul id="lists" class="eb-list"></ul>
<div id="listView" hidden>
<h2 id="activeList"></h2>
<div class="eb-row"><input id="item" placeholder="Add an item"><button id="newItem">Add</button></div>
<ul id="items" class="eb-list"></ul>
<p class="eb-muted">Click an item to toggle complete.</p>
</div>
</section>
<p id="status" class="eb-muted"></p>
</main>
<script src="./app.js"></script>
</body>
</html>
