<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eB Lists</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; font-family: system-ui }
    input, button, select { font: inherit; padding: 6px; margin: 3px }
    button { cursor: pointer }
    .card { border: 1px solid #8886; border-radius: 8px; padding: 12px; margin: 12px }
    .muted { opacity: .7 }
    .eb-row { display: flex; align-items: center; gap: 8px }
    .cf-build-status { font-size: 12px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap }
    .cf-build-dot { font-size: 11px }
    .app-icon-label { display: none }
    .eb-app-button { position: relative }
    .eb-app-button:hover::after,
    .eb-app-button:focus-visible::after {
      content: attr(title);
      position: absolute;
      left: calc(100% + 6px);
      top: 50%;
      transform: translateY(-50%);
      padding: 3px 6px;
      border: 1px solid #8886;
      border-radius: 4px;
      background: Canvas;
      color: CanvasText;
      white-space: nowrap;
      font-size: 12px;
      z-index: 20;
    }

    .eb-header { display: block !important; visibility: visible !important }
    .eb-header-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 52px;
      padding: 0 12px;
    }
    .eb-header-inner > .eb-row:nth-child(2) { justify-self: center }
    .eb-account { justify-self: end; display: flex; align-items: center; gap: 6px }
    .eb-account #user { font-weight: 500 }
    .eb-account #signOut,
    .eb-account #headerSignIn { margin: 0; padding: 4px 7px }
    .eb-navigation {
      display: grid !important;
      grid-template-columns: 48px var(--tree-width,220px) 6px minmax(0,1fr);
      min-height: calc(100vh - 52px);
      align-items: stretch;
    }
    .eb-main { min-width: 0 }
    .eb-tree { display: flex; flex-direction: column; gap: 1px; padding: 6px; min-width: 0; overflow: auto }
    .eb-tree-section { font-size: 12px; font-weight: 600; padding: 5px 6px; opacity: .7 }
    .eb-tree-row { display: flex; min-width: 0 }
    .eb-tree-entry { display: flex; align-items: center; min-width: 0; width: 100% }
    .eb-tree-node {
      text-align: left;
      border: 0;
      background: transparent;
      padding: 4px 6px;
      margin: 0;
      border-radius: 3px;
      font-size: 13px;
      color: inherit;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .eb-tree-node:hover { background: #8882 }
    .eb-tree-node[aria-current="true"] { font-weight: 600; background: #8882 }
    .eb-tree-actions { display: flex; gap: 1px; flex: 0 0 auto; opacity: .72 }
    .eb-tree-action {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 2px 4px;
      margin: 0;
      min-width: 20px;
      border-radius: 3px;
      font-size: 12px;
    }
    .eb-tree-action:hover,
    .eb-tree-action:focus-visible { background: #8883; opacity: 1 }
    .eb-tree-child { padding-left: 0 }
    .eb-tree-splitter { cursor: col-resize; background: #8884; position: relative; z-index: 5 }
    .eb-tree-splitter:hover,
    .eb-tree-splitter.dragging { background: #8888 }
    .eb-tree-splitter::after {
      content: '⋮';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      font-size: 12px;
      opacity: .65;
    }
    .content-actions { display: flex; align-items: center; gap: 2px; margin-left: auto }
    .content-actions button {
      padding: 3px 6px;
      margin: 0;
      border: 1px solid #8886;
      background: transparent;
      border-radius: 3px;
    }
    .eb-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid #8886;
      border-radius: 5px;
      padding: 4px 7px;
      margin: 4px 0;
      list-style: none;
    }
    .eb-item-main { display: flex; align-items: center; gap: 8px; min-width: 0 }
    .eb-item-icon,
    .eb-item-action { border: 0; background: transparent; color: inherit; padding: 2px 5px; margin: 0; min-width: 24px }
    .eb-item-actions { display: flex; gap: 2px; opacity: .7 }
    .eb-item-row:hover .eb-item-actions,
    .eb-item-action:focus-visible { opacity: 1 }
    .eb-item-action:disabled { opacity: .25; cursor: default }
    .eb-item-text.completed { text-decoration: line-through; opacity: .65 }
    .eb-item-edit { margin: 0; padding: 3px 5px; min-width: 0 }
    .eb-content-frame { width: 100%; height: calc(100vh - 130px); border: 0; background: Canvas }
    #listView > .eb-row { align-items: center }
    #listOrderToggle { white-space: nowrap }
  </style>
</head>
<body>
  <div id="shell" class="eb-shell">
    <header id="header" class="eb-header">
      <div class="eb-header-inner">
        <div class="cf-build-status" title="Cloudflare deployment status">
          <span class="cf-build-dot">●</span>
          <span>CF: deployed</span>
        </div>
        <div class="eb-row">
          <strong>eB Lists</strong>
          <span class="eb-app-name">Lists</span>
        </div>
        <div id="account" class="eb-account">
          <strong id="user"></strong>
          <button id="signOut" type="button">Sign out</button>
        </div>
      </div>
    </header>

    <div class="eb-navigation">
      <nav id="appRail" class="eb-app-rail" aria-label="Applications">
        <button class="eb-app-button" id="infoNav" title="Info" aria-label="Info"><span aria-hidden="true">ⓘ</span></button>
        <button class="eb-app-button" id="listsNav" title="Lists" aria-label="Lists" aria-current="true"><span aria-hidden="true">☷</span></button>
        <button class="eb-app-button" id="supportableNav" title="Supportable" aria-label="Supportable"><span aria-hidden="true">◉</span></button>
      </nav>

      <nav id="tree" class="eb-tree" aria-label="Application navigation"></nav>
      <div id="treeSplitter" class="eb-tree-splitter" role="separator" aria-label="Resize tree pane" aria-orientation="vertical" tabindex="0"></div>

      <main class="eb-main">
        <section id="auth" class="card">
          <h2>Sign in</h2>
          <input id="email" type="email" placeholder="Email" autocomplete="email">
          <input id="password" type="password" placeholder="Password" autocomplete="current-password">
          <div>
            <button id="signIn">Sign in</button>
            <button id="signUp">Create account</button>
          </div>
        </section>

        <section id="app" class="card" hidden>
          <div class="eb-row">
            <h2 id="appTitle">Lists</h2>
            <div class="content-actions">
              <button id="themeAction" title="Theme" aria-label="Theme">◐</button>
              <button id="moreAction" title="Actions" aria-label="Actions">⋮</button>
            </div>
          </div>

          <div id="listWorkspace">
            <div>
              <input id="listName" placeholder="New list name">
              <label><input id="listOrdered" type="checkbox"> Ordered</label>
              <button id="newList">Create list</button>
            </div>

            <div id="listView" hidden>
              <div class="eb-row">
                <h2 id="activeList"></h2>
                <button id="listOrderToggle" type="button" title="Toggle ordered or unordered">Unordered</button>
              </div>
              <div class="muted" id="listMode"></div>
              <input id="item" placeholder="Add an item">
              <button id="newItem">Add</button>
              <ul id="items"></ul>
              <p class="muted">Click the circle to complete. Ordered lists also have move controls.</p>
            </div>
          </div>

          <iframe id="contentFrame" class="eb-content-frame" title="Application content" hidden></iframe>
        </section>

        <p id="status" class="muted"></p>
      </main>
    </div>
  </div>

  <script type="module">
    import { loadEBlissTheme } from './theme-loader.js';
    await loadEBlissTheme();
  </script>
  <script src="./app.js"></script>
  <script src="./system-ui.js"></script>
  <script src="./template-dnd.js"></script>
  <script src="./tree-collapse.js"></script>
  <script src="./tree-dnd.js"></script>
  <script src="./build-status.js"></script>

  <script>
    (() => {
      const db = window.supabase.createClient(
        'https://zaabghrczrbqkxrhkinj.supabase.co',
        'sb_publishable_QL6Bz9m30CV8HFIdkLQ42Q_N9AFIOkF'
      );
      const header = document.getElementById('header');
      const account = document.getElementById('account');
      const userEl = document.getElementById('user');
      const auth = document.getElementById('auth');
      const email = document.getElementById('email');

      function render(session) {
        header.hidden = false;
        header.style.display = 'block';
        account.hidden = false;

        if (session?.user) {
          userEl.textContent = session.user.email || '';
          document.getElementById('headerSignIn')?.remove();
          document.getElementById('signOut').hidden = false;
        } else {
          userEl.textContent = '';
          document.getElementById('signOut').hidden = true;
          if (!document.getElementById('headerSignIn')) {
            const b = document.createElement('button');
            b.id = 'headerSignIn';
            b.type = 'button';
            b.textContent = 'Sign in';
            b.onclick = () => email?.focus();
            account.appendChild(b);
          }
        }
      }

      db.auth.onAuthStateChange((_event, session) => render(session));
      db.auth.getSession().then(({ data }) => render(data.session));
    })();
  </script>

  <script>
    (() => {
      const root = document.documentElement;
      const splitter = document.getElementById('treeSplitter');
      const min = 150;
      const max = 520;
      const key = 'eb-tree-width';
      let width = Number(localStorage.getItem(key)) || 220;

      const apply = () => {
        width = Math.max(min, Math.min(max, width));
        root.style.setProperty('--tree-width', width + 'px');
        splitter.setAttribute('aria-valuenow', String(width));
      };

      apply();

      let dragging = false;
      const move = e => {
        if (!dragging) return;
        const rect = splitter.getBoundingClientRect();
        width = e.clientX - rect.left - 48;
        apply();
      };

      splitter.addEventListener('pointerdown', e => {
        dragging = true;
        splitter.classList.add('dragging');
        splitter.setPointerCapture(e.pointerId);
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
      });

      splitter.addEventListener('pointermove', move);

      splitter.addEventListener('pointerup', e => {
        dragging = false;
        splitter.classList.remove('dragging');
        try {
          splitter.releasePointerCapture(e.pointerId);
        } catch {}
        localStorage.setItem(key, String(width));
        document.body.style.cursor = '';
      });

      splitter.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') {
          width -= 10;
          apply();
          localStorage.setItem(key, String(width));
        }
        if (e.key === 'ArrowRight') {
          width += 10;
          apply();
          localStorage.setItem(key, String(width));
        }
      });
    })();
  </script>
</body>
</html>
