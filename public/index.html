<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eB Lists</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:system-ui}
input,button,select{font:inherit;padding:6px;margin:3px}
button{cursor:pointer}
.card{border:1px solid #8886;border-radius:8px;padding:12px;margin:12px}
.muted{opacity:.7}
.eb-row{display:flex;align-items:center;gap:8px}
.eb-main ul{padding-left:20px}
.ordered-items{list-style-type:decimal}
.cf-build-status{font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.cf-build-dot{font-size:11px}
.app-icon-label{font-size:10px;line-height:1.1}
.eb-tree{display:flex;flex-direction:column;gap:2px;padding:6px;min-width:170px}
.eb-tree-node{text-align:left;border:0;background:transparent;padding:4px 6px;margin:0;border-radius:3px;font-size:13px}
.eb-tree-node[aria-current="true"]{font-weight:600;background:#8882}
</style>
</head>
<body>
<div id="shell" class="eb-shell">
  <header id="header" class="eb-header">
    <div class="eb-header-inner">
      <div class="cf-build-status" title="Cloudflare deployment status">
        <span class="cf-build-dot">●</span><span>CF: deployed</span>
      </div>
      <div class="eb-row">
        <strong>eB Lists</strong>
        <span class="eb-app-name">Lists</span>
      </div>
      <div></div>
    </div>
  </header>
  <div class="eb-navigation">
    <nav id="appRail" class="eb-app-rail" aria-label="Applications">
      <button class="eb-app-button" id="infoNav" title="Info" aria-label="Info">
        <span aria-hidden="true">ⓘ</span><span class="app-icon-label">Info</span>
      </button>
      <button class="eb-app-button" id="listsNav" title="Lists" aria-label="Lists" aria-current="true">
        <span aria-hidden="true">☷</span><span class="app-icon-label">Lists</span>
      </button>
      <button class="eb-app-button" id="supportableNav" title="Supportable" aria-label="Supportable">
        <span aria-hidden="true">◉</span><span class="app-icon-label">Support</span>
      </button>
    </nav>
    <nav id="tree" class="eb-tree" aria-label="Lists"></nav>
    <main class="eb-main">
      <div id="subheader" class="eb-subheader" style="margin:-8px -8px 8px"></div>
      <section id="auth" class="card">
        <h2>Sign in</h2>
        <input id="email" type="email" placeholder="Email" autocomplete="email">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password">
        <div><button id="signIn">Sign in</button><button id="signUp">Create account</button></div>
      </section>
      <section id="app" class="card" hidden>
        <div><strong id="user"></strong> <button id="signOut">Sign out</button></div>
        <h2>Lists</h2>
        <div><input id="listName" placeholder="New list name"><label><input id="listOrdered" type="checkbox"> Ordered</label><button id="newList">Create list</button></div>
        <div id="listView" hidden>
          <h2 id="activeList"></h2>
          <div class="muted" id="listMode"></div>
          <input id="item" placeholder="Add an item"><button id="newItem">Add</button>
          <ul id="items"></ul>
          <p class="muted">Click an item to toggle complete.</p>
        </div>
      </section>
      <p id="status" class="muted"></p>
    </main>
  </div>
</div>
<script type="module">
  import { loadEBlissTheme } from './theme-loader.js';
  await loadEBlissTheme();

  document.getElementById('infoNav').onclick = () => {
    document.getElementById('status').textContent = 'eB Lists — shared ordered and unordered lists.';
  };
  document.getElementById('listsNav').onclick = () => {
    document.getElementById('status').textContent = '';
  };
  document.getElementById('supportableNav').onclick = () => {
    document.getElementById('status').textContent = 'Supportable — support interface coming next.';
  };
</script>
<script src="./app.js"></script>
</body>
</html>
