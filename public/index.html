<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eBliss Lists</title>
<style>
html,body{margin:0;padding:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#222}
body{overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#fff;border-bottom:1px solid #ddd;box-sizing:border-box}
main{flex:1;min-height:0;display:flex;overflow:hidden}
#root{flex:1;min-width:0;overflow:auto}
button,input,select{font:inherit}
</style>
</head>
<body>
<div id="app">
<header><strong>eBliss Lists</strong><button id="sign-out" hidden>Sign out</button></header>
<main><div id="root"></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
