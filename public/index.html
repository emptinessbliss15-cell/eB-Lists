<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eB Lists</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase.js"></script><link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"></head><body><div id="shell" class="eb-shell"><header id="header" class="eb-header"><div class="eb-header-inner"><div class="eb-header-left"><button id="hardRefresh" class="eb-refresh" type="button" title="Refresh app" aria-label="Refresh app" onclick="location.reload()">↻</button><div class="cf-build-status" title="Cloudflare deployment status"><span class="cf-build-dot">●</span><span>CF: deployed</span></div><span id="status" class="eb-status" aria-live="polite"></span></div><div class="eb-row"><strong>eB Lists</strong><span class="eb-app-name">Lists</span></div><div id="account" class="eb-account"><span id="user" class="eb-account-user"></span><button id="signOut" type="button">Sign out</button></div></div></header><div class="eb-navigation"><nav id="appRail" class="eb-app-rail" aria-label="Applications"><button class="eb-app-button" id="listsNav" title="Lists" aria-label="Lists" aria-current="true"><span aria-hidden="true">☷</span></button><button class="eb-app-button" id="adminNav" title="Admin" aria-label="Admin"><span aria-hidden="true">⚙</span></button></nav><div class="eb-tree-pane"><div class="eb-tree-toolbar"><button id="treeRefresh" class="eb-refresh" type="button" title="Refresh lists from database" aria-label="Refresh lists from database">↻</button><button id="treeExpandAll" class="eb-refresh" type="button" title="Expand all" aria-label="Expand all">▾</button><button id="treeCollapseAll" class="eb-refresh" type="button" title="Collapse all" aria-label="Collapse all">▸</button></div><nav id="tree" class="eb-tree" aria-label="Lists tree"></nav></div><div id="treeSplitter" class="eb-tree-splitter" role="separator" aria-label="Resize tree pane" aria-orientation="vertical" tabindex="0"></div><main class="eb-main"><section id="auth" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><div><button id="signIn">Sign in</button><button id="signUp">Create account</button></div></section><section id="app" class="card" hidden><div class="eb-row"><button id="listRefresh" class="eb-refresh" type="button" title="Refresh current list from database" aria-label="Refresh current list from database">↻</button><h2 id="appTitle">Lists</h2><div class="content-actions"><button id="themeAction" title="Theme" aria-label="Theme">◐</button><button id="moreAction" title="Actions" aria-label="Actions">⋮</button></div></div><div id="listWorkspace"><div><input id="listName" placeholder="New list name"><label><input id="listOrdered" type="checkbox"> Ordered</label><button id="newList">Create list</button></div><div id="listView" hidden><div class="eb-row"><h2 id="activeList"></h2><button id="listOrderToggle" type="button" title="Toggle ordered or unordered">Unordered</button></div><div class="muted" id="listMode"></div><input id="item" placeholder="Add an item"><button id="newItem">Add</button><div id="tabulatorExperiment" class="tabulator-experiment"><h3>Grid experiment — Tabulator</h3><div id="tabulatorGrid"></div></div><ul id="items"></ul></div></div><iframe id="contentFrame" class="eb-content-frame" title="Application content" hidden></iframe></section></main></div></div><script type="module" src="./app.js"></script><script type="module">import{connectListsTree}from'./lib/ListsTreeBridge.js';connectListsTree(window.eBListsTree,{supabase:window.eB.supabase,refresh:()=>window.eBLists?.refreshTree?.()});</script><script src="./auth.js"></script><script src="./system-ui.js"></script><script src="./template-dnd.js"></script><script>(()=>{const root=document.documentElement,splitter=document.getElementById('treeSplitter');const min=220,max=Math.max(1200,Math.floor(window.innerWidth*.8)),key='eb-tree-width';let width=Number(localStorage.getItem(key))||360;const apply=()=>{width=Math.max(min,Math.min(max,width));root.style.setProperty('--tree-width',width+'px');splitter.setAttribute('aria-valuenow',String(width));};apply();let dragging=false;const move=e=>{if(!dragging)return;const nav=document.querySelector('.eb-navigation');const rect=nav.getBoundingClientRect();width=e.clientX-rect.left;apply();};splitter.addEventListener('pointerdown',e=>{dragging=true;splitter.classList.add('dragging');splitter.setPointerCapture(e.pointerId);document.body.style.cursor='col-resize';e.preventDefault();});splitter.addEventListener('pointermove',move);splitter.addEventListener('pointerup',e=>{dragging=false;splitter.classList.remove('dragging');try{splitter.releasePointerCapture(e.pointerId)}catch{};localStorage.setItem(key,String(width));document.body.style.cursor='';});splitter.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){width-=10;apply();localStorage.setItem(key,String(width));}if(e.key==='ArrowRight'){width+=10;apply();localStorage.setItem(key,String(width));}});const treeRefresh=document.getElementById('treeRefresh'),expand=document.getElementById('treeExpandAll'),collapse=document.getElementById('treeCollapseAll');treeRefresh.addEventListener('click',()=>window.eBLists?.refreshTree?.());expand.addEventListener('click',()=>{const tree=window.eBListsTree;if(!tree)return;tree.nodes.filter(n=>tree.hasChildren(tree.getId(n))).forEach(n=>tree.expandedIds.add(tree.getId(n)));tree.render();});collapse.addEventListener('click',()=>{const tree=window.eBListsTree;if(!tree)return;tree.expandedIds.clear();tree.render();});})();</script></body></html>
