<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eB Lists</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui}input,button,select{font:inherit;padding:6px;margin:3px}button{cursor:pointer}.card{border:1px solid #8886;border-radius:8px;padding:12px;margin:12px}.muted{opacity:.7}.eb-row{display:flex;align-items:center;gap:8px}.cf-build-status{font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.cf-build-dot{font-size:11px}.app-icon-label{display:none}.eb-app-button{position:relative}.eb-app-button:hover::after,.eb-app-button:focus-visible::after{content:attr(title);position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);padding:3px 6px;border:1px solid #8886;border-radius:4px;background:Canvas;color:CanvasText;white-space:nowrap;font-size:12px;z-index:20}.eb-tree{display:flex;flex-direction:column;gap:1px;padding:6px;min-width:190px}.eb-tree-section{font-size:12px;font-weight:600;padding:5px 6px;opacity:.7}.eb-tree-row{display:flex}.eb-tree-child{padding-left:14px}.eb-tree-node{text-align:left;border:0;background:transparent;padding:4px 6px;margin:0;border-radius:3px;font-size:13px;color:inherit}.eb-tree-node:hover{background:#8882}.eb-tree-node[aria-current="true"]{font-weight:600;background:#8882}.content-actions{display:flex;align-items:center;gap:2px;margin-left:auto}.content-actions button{padding:3px 6px;margin:0;border:1px solid #8886;background:transparent;border-radius:3px}.eb-item-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #8886;border-radius:5px;padding:4px 7px;margin:4px 0;list-style:none}.eb-item-main{display:flex;align-items:center;gap:8px;min-width:0}.eb-item-icon,.eb-item-action{border:0;background:transparent;color:inherit;padding:2px 5px;margin:0;min-width:24px}.eb-item-actions{display:flex;gap:2px;opacity:.55}.eb-item-row:hover .eb-item-actions,.eb-item-action:focus-visible{opacity:1}.eb-item-text.completed{text-decoration:line-through;opacity:.65}.eb-item-edit{margin:0;padding:3px 5px;min-width:0}.eb-content-frame{width:100%;height:calc(100vh - 130px);border:0;background:Canvas}</style></head><body><div id="shell" class="eb-shell"><header id="header" class="eb-header"><div class="eb-header-inner"><div class="cf-build-status" title="Cloudflare deployment status"><span class="cf-build-dot">●</span><span>CF: deployed</span></div><div class="eb-row"><strong>eB Lists</strong><span class="eb-app-name">Lists</span></div><div></div></div></header><div class="eb-navigation"><nav id="appRail" class="eb-app-rail" aria-label="Applications"><button class="eb-app-button" id="infoNav" title="Info" aria-label="Info"><span aria-hidden="true">ⓘ</span></button><button class="eb-app-button" id="listsNav" title="Lists" aria-label="Lists" aria-current="true"><span aria-hidden="true">☷</span></button><button class="eb-app-button" id="supportableNav" title="Supportable" aria-label="Supportable"><span aria-hidden="true">◉</span></button></nav><nav id="tree" class="eb-tree" aria-label="Application navigation"></nav><main class="eb-main"><section id="auth" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><div><button id="signIn">Sign in</button><button id="signUp">Create account</button></div></section><section id="app" class="card" hidden><div><strong id="user"></strong> <button id="signOut">Sign out</button></div><div class="eb-row"><h2 id="appTitle">Lists</h2><div class="content-actions"><button id="themeAction" title="Theme" aria-label="Theme">◐</button><button id="moreAction" title="Actions" aria-label="Actions">⋮</button></div></div><div id="listWorkspace"><div><input id="listName" placeholder="New list name"><label><input id="listOrdered" type="checkbox"> Ordered</label><button id="newList">Create list</button></div><div id="listView" hidden><div class="eb-row"><h2 id="activeList"></h2></div><div class="muted" id="listMode"></div><input id="item" placeholder="Add an item"><button id="newItem">Add</button><ul id="items"></ul><p class="muted">Click the circle to complete. Edit or delete with the row actions.</p></div></div><iframe id="contentFrame" class="eb-content-frame" title="Application content" hidden></iframe></section><p id="status" class="muted"></p></main></div></div><script type="module">import{loadEBlissTheme}from'./theme-loader.js';await loadEBlissTheme();</script><script src="./app.js"></script></body></html>
