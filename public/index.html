<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eB Lists</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="shell" class="eb-shell">
  <header class="eb-header"></header>
  <div class="eb-navigation">
    <nav id="appRail" aria-label="Applications"></nav>
    <nav id="tree" aria-label="Context"></nav>
    <main class="eb-main">
      <div class="eb-subheader"></div>
      <section id="auth" class="eb-card">
        <h2>Sign in</h2>
        <div class="eb-row">
          <input id="email" type="email" placeholder="Email" autocomplete="email">
          <input id="password" type="password" placeholder="Password" autocomplete="current-password">
        </div>
        <div class="eb-row">
          <button id="signIn">Sign in</button>
          <button id="signUp" class="secondary">Create account</button>
        </div>
      </section>
      <section id="app" class="eb-card" hidden>
        <div class="eb-spread"><strong id="user"></strong><button id="signOut" class="secondary">Sign out</button></div>
        <h2>Lists</h2>
        <div class="eb-row">
          <input id="listName" placeholder="New list name">
          <label><input id="listOrdered" type="checkbox"> Ordered</label>
          <button id="newList">Create list</button>
        </div>
        <ul id="lists" class="eb-list"></ul>
        <div id="listView" hidden>
          <div class="eb-spread">
            <h2 id="activeList"></h2>
            <button id="deleteList" class="secondary" type="button">Delete list</button>
          </div>
          <div class="eb-muted" id="listMode"></div>
          <div class="eb-row">
            <input id="item" placeholder="Add an item">
            <button id="newItem">Add</button>
          </div>
          <ul id="items" class="eb-list"></ul>
          <p class="eb-muted">Click an item to toggle complete.</p>
        </div>
      </section>
      <p id="status" class="eb-muted"></p>
    </main>
  </div>
</div>
<script type="module">
  import { loadEBlissTheme } from './theme-loader.js';
  try { await loadEBlissTheme(); } catch (error) { console.error(error); }
</script>
<script src="./app.js"></script>
</body>
</html>
