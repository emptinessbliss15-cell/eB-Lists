<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eB Lists</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root[data-density="compact"]{--eb-space:3px}.eb-content{max-width:none}.eb-card{padding:8px;margin:5px 0}.eb-card h2{font-size:1rem}.eb-list{margin:3px 0;padding-left:20px}.eb-list li{margin:1px 0}.eb-item-row{gap:3px}.eb-item-text{flex:1;min-width:0;text-align:left}.eb-item-check{flex:0 0 auto;width:16px;height:16px;margin:0 2px 0 0;cursor:pointer}.eb-item-controls{display:inline-flex;gap:2px;flex:0 0 auto}.eb-order-button{min-width:30px;padding:3px 6px}.eb-row input{min-width:120px}button,input,select{padding:4px 7px}.eb-spread{gap:3px}.eb-header-actions{display:flex;align-items:center;gap:6px}.eb-navigation{display:grid!important;grid-template-columns:48px minmax(180px,280px) 10px minmax(0,1fr)!important;min-width:0}.eb-navigation.list-nav-collapsed{grid-template-columns:48px 0 10px minmax(0,1fr)!important}.eb-app-rail{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 3px;border-right:1px solid var(--eb-border,#ddd);background:var(--eb-surface,transparent)}.eb-app-rail button{position:relative;width:40px!important;min-height:40px!important;padding:2px!important;font-size:0!important;line-height:1}.eb-app-rail button:hover::after,.eb-app-rail button:focus-visible::after{content:attr(data-label);position:absolute;left:calc(100% + 7px);top:50%;transform:translateY(-50%);z-index:20;white-space:nowrap;font-size:12px!important;line-height:1;padding:5px 7px;border:1px solid var(--eb-border,#ccc);border-radius:4px;background:var(--eb-bg,#fff);box-shadow:0 2px 8px rgba(0,0,0,.15);color:inherit}.eb-app-rail button[aria-current="page"]{font-weight:700;outline:2px solid currentColor;outline-offset:-2px}.eb-app-icon{font-size:20px!important;display:block}.eb-tree{padding:8px 6px;overflow:auto;min-width:0;border-right:0;position:relative}.eb-navigation.list-nav-collapsed .eb-tree{padding:0;overflow:hidden}.eb-tree-resize{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize;z-index:15}.eb-workspace-resize{height:100%;width:10px;cursor:col-resize;background:var(--eb-surface,#f3f3f3);border-left:1px solid var(--eb-border,#bbb);border-right:1px solid var(--eb-border,#bbb);position:relative;z-index:15;box-sizing:border-box}.eb-workspace-resize::after{content:'⋮';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px;line-height:1;color:var(--eb-muted,#777);pointer-events:none}.eb-workspace-resize:hover{background:var(--eb-bg,#fff);border-color:var(--eb-text,#777)}.eb-list-nav-title{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}.eb-list-nav-title button{padding:2px 5px}.eb-list-create{display:grid;gap:4px;margin-bottom:8px}.eb-list-create input[type=text]{width:100%;min-width:0}.eb-list-create label{font-size:12px}.eb-list-nav{list-style:none;padding:0;margin:0}.eb-list-nav li{margin:1px 0}.eb-list-nav .eb-list-row{display:flex;gap:2px;align-items:center}.eb-list-nav .eb-list-open{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eb-list-nav .eb-list-action{flex:0 0 auto;padding:3px 5px}.eb-new-item{display:grid;grid-template-columns:auto minmax(150px,1fr) minmax(150px,1fr) auto;gap:3px;align-items:center}.eb-new-item-fields{display:contents}.eb-new-item-fields label{display:inline-flex;align-items:center;gap:4px;font-size:12px}.eb-new-item-fields input,.eb-new-item-fields select{min-width:100px}.eb-template-label{font-size:11px}.eb-main{min-width:0;display:grid!important;grid-template-columns:minmax(0,1fr) 280px;gap:8px;position:relative}.eb-main>.eb-content{min-width:0}.eb-agent{border-left:1px solid var(--eb-border,#ddd);padding:8px;min-width:0}.eb-agent-label{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px}.eb-agent-label button{padding:2px 6px}.eb-agent-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px;margin-top:8px}.eb-agent-placeholder-note{font-size:12px;color:var(--eb-muted,#777);padding:12px 4px;border:1px dashed var(--eb-border,#bbb);text-align:center}.eb-agent input:disabled,.eb-agent button:disabled{opacity:.55}.eb-agent-hidden .eb-agent{display:none}.eb-agent-hidden .eb-main{grid-template-columns:minmax(0,1fr)}#agentShow{display:none;position:absolute;right:5px;top:5px;z-index:10;padding:3px 6px}.eb-agent-hidden #agentShow{display:block}.eb-list-title-row{display:flex;align-items:center;gap:5px}.eb-list-title-row h2{margin:0}.eb-list-order-toggle{padding:2px 6px;font-size:12px}
</style></head><body data-density="compact"><div id="shell" class="eb-shell"><header class="eb-header"><div class="eb-header-inner"><a class="eb-brand" href="/">eBliss</a><div class="eb-header-actions"><span class="eb-app-name">Lists</span><button id="signOut" class="secondary" type="button" hidden>Sign out</button></div></div></header><div id="navigation" class="eb-navigation"><nav id="appRail" class="eb-app-rail" aria-label="Applications"><button class="secondary" type="button" title="Lists" aria-label="Lists" data-label="Lists" aria-current="page"><span class="eb-app-icon">☷</span></button><button class="secondary" type="button" title="Supportable" aria-label="Supportable" data-label="Supportable"><span class="eb-app-icon">◉</span></button></nav><nav id="tree" class="eb-tree" aria-label="Lists" hidden><div class="eb-tree-resize" title="Resize list navigation"></div><div class="eb-list-nav-title"><span>Lists</span><button id="collapseTree" class="secondary" type="button" title="Hide lists navigation" aria-label="Hide lists navigation">‹</button></div><div class="eb-list-create"><input id="listName" type="text" placeholder="New list name"><label><input id="listOrdered" type="checkbox"> Ordered</label><button id="newList" type="button">Create list</button></div><ul id="lists" class="eb-list-nav"></ul></nav><div id="workspaceResize" class="eb-workspace-resize" title="Resize list navigation and workspace" aria-label="Resize list navigation and workspace"></div><main class="eb-main"><div class="eb-content"><div class="eb-subheader"><div class="eb-subheader-inner"><strong>Lists</strong><span class="eb-muted">Dense view</span><button id="expandTree" class="secondary" type="button" hidden title="Show lists navigation" aria-label="Show lists navigation">› Lists</button></div></div><section id="auth" class="eb-card"><h2>Sign in</h2><div class="eb-row"><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signIn">Sign in</button><button id="signUp" class="secondary">Create account</button></div></section><section id="app" class="eb-card" hidden><div id="listView" hidden><div class="eb-spread"><div class="eb-list-title-row"><h2 id="activeList"></h2><button id="listOrderToggle" class="secondary eb-list-order-toggle" type="button" hidden></button></div><button id="deleteList" class="secondary" type="button">Delete list</button></div><div class="eb-muted" id="listMode"></div><div class="eb-row eb-new-item"><label class="eb-template-label" for="itemTemplate">Type</label><select id="itemTemplate" aria-label="Item template"></select><div id="newItemFields" class="eb-new-item-fields"></div><button id="newItem" type="button">Add</button></div><ul id="items" class="eb-list"></ul></div></section><p id="status" class="eb-muted"></p></div><section class="eb-agent" aria-label="Agent chat"><div class="eb-agent-label">Agent</div><div class="eb-agent-row"><input id="agentInput" placeholder="Ask about your lists…" aria-label="Ask the eBliss agent"><button id="agentSend" type="button">Send</button></div></section></main></div></div><script type="module">import{loadEBlissTheme}from'./theme-loader.js';try{await loadEBlissTheme()}catch(error){console.error(error)}</script><script type="module" src="./app.js"></script><script type="module" src="./checkbox-column.js"></script><script type="module" src="./nested-lists.js"></script><script type="module" src="./holon-view-router.js"></script><script type="module" src="./tree-special.js"></script><script type="module" src="./system-views.js"></script><script src="./agent-placeholder.js"></script><script>const nav=document.getElementById('navigation'),collapse=document.getElementById('collapseTree'),expand=document.getElementById('expandTree'),resize=document.querySelector('.eb-tree-resize'),workspaceResize=document.getElementById('workspaceResize');const saved=localStorage.getItem('ebListsNavWidth');if(saved)nav.style.gridTemplateColumns=`48px ${saved}px 10px minmax(0,1fr)`;const collapsed=localStorage.getItem('ebListsNavCollapsed')==='1';if(collapsed){nav.classList.add('list-nav-collapsed');expand.hidden=false}collapse.onclick=()=>{nav.classList.add('list-nav-collapsed');expand.hidden=false;localStorage.setItem('ebListsNavCollapsed','1')};expand.onclick=()=>{nav.classList.remove('list-nav-collapsed');expand.hidden=true;localStorage.setItem('ebListsNavCollapsed','0')};let dragging=false;resize.onmousedown=e=>{dragging=true;e.preventDefault()};window.addEventListener('mousemove',e=>{if(!dragging||nav.classList.contains('list-nav-collapsed'))return;const rect=nav.getBoundingClientRect();const width=Math.max(160,Math.min(420,e.clientX-rect.left-48));nav.style.gridTemplateColumns=`48px ${width}px 10px minmax(0,1fr)`;localStorage.setItem('ebListsNavWidth',String(width))});let workspaceDragging=false;workspaceResize.onmousedown=e=>{workspaceDragging=true;e.preventDefault()};window.addEventListener('mousemove',e=>{if(!workspaceDragging||nav.classList.contains('list-nav-collapsed'))return;const rect=nav.getBoundingClientRect();const width=Math.max(160,Math.min(420,e.clientX-rect.left-48));nav.style.gridTemplateColumns=`48px ${width}px 10px minmax(220px,1fr)`;localStorage.setItem('ebListsNavWidth',String(width))});window.addEventListener('mouseup',()=>{dragging=false;workspaceDragging=false});const orderToggle=document.getElementById('listOrderToggle');let orderListId=null,orderValue=false;function updateOrderToggle(){orderToggle.hidden=!orderListId;orderToggle.textContent=orderValue?'Ordered':'Unordered';orderToggle.title=orderValue?'Switch to unordered':'Switch to ordered'}document.addEventListener('eb:list-selected',e=>{const l=e.detail?.list;if(!l)return;orderListId=l.id;orderValue=!!l.ordered;updateOrderToggle()});orderToggle.onclick=async()=>{if(!orderListId)return;orderToggle.disabled=true;const next=!orderValue;const client=window.supabase.createClient('https://zaabghrczrbqkxrhkinj.supabase.co','sb_publishable_QL6Bz9m30CV8HFIdkLQ42Q_N9AFIOkF');const{data,error}=await client.from('lists').update({ordered:next}).eq('id',orderListId).select().single();if(error){document.getElementById('status').textContent=`Order mode update failed: ${error.message}`;orderToggle.disabled=false;return}orderValue=!!data.ordered;updateOrderToggle();document.getElementById('listMode').textContent=orderValue?'Ordered · use ↑ / ↓ to arrange':'Unordered';document.dispatchEvent(new CustomEvent('eb:lists-changed'));orderToggle.disabled=false};</script></body></html>
