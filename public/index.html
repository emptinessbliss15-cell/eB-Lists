<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eB Lists</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>

<body>
  <div id="shell" class="eb-shell">
    <header id="header" class="eb-header">
      <div class="eb-header-inner">
        <button id="refreshPage" type="button" title="Refresh" aria-label="Refresh">↻</button>
        <div class="cf-build-status" title="Cloudflare deployment status"><span class="cf-build-dot">●</span><span>CF:
            deployed</span></div>
        <div class="eb-row"><strong>eB Lists</strong><span class="eb-app-name">Lists</span>
        </div>
        <div>
          <section id="auth" class="card">
          <h2>Sign in</h2><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password"
            type="password" placeholder="Password" autocomplete="current-password">
          <button id="signIn">Sign in</button><button id="signUp">Create account</button>
        </section>
        <div id="userAuth">
          <strong id="user"></strong>
          <button id="signOut">Sign out</button>
        </div>
        </div>
      </div>
    </header>
    <div class="eb-navigation">
      <nav id="appRail" class="eb-app-rail" aria-label="Applications"><button class="eb-app-button" id="infoNav"
          title="Info" aria-label="Info"><span aria-hidden="true">ⓘ</span></button><button class="eb-app-button"
          id="listsNav" title="Lists" aria-label="Lists" aria-current="true"><span
            aria-hidden="true">☷</span></button><button class="eb-app-button" id="supportableNav" title="Supportable"
          aria-label="Supportable"><span aria-hidden="true">◉</span></button></nav>
      <nav id="tree" class="eb-tree" aria-label="Application navigation"></nav>
      <div id="treeSplitter" class="eb-tree-splitter" role="separator" aria-label="Resize tree pane"
        aria-orientation="vertical" tabindex="0"></div>
      <main class="eb-main">
        <section id="app" class="card" hidden>
          <div class="eb-row">
            <h2 id="appTitle">Lists</h2>
            <div class="content-actions"><button id="themeAction" title="Theme" aria-label="Theme">◐</button><button
                id="moreAction" title="Actions" aria-label="Actions">⋮</button></div>
          </div>
          <div id="listWorkspace">
            <div><input id="listName" placeholder="New list name"><label><input id="listOrdered" type="checkbox">
                Ordered</label><button id="newList">Create list</button></div>
            <div id="listView" hidden>
              <div class="eb-row">
                <h2 id="activeList"></h2><button id="listOrderToggle" type="button"
                  title="Toggle ordered or unordered">Unordered</button>
              </div>
              <div class="muted" id="listMode"></div><input id="item" placeholder="Add an item"><button
                id="newItem">Add</button>
              <ul id="items"></ul>
              <p class="muted">Click the circle to complete. Ordered lists also have move controls.</p>
            </div>
          </div><iframe id="contentFrame" class="eb-content-frame" title="Application content" hidden></iframe>
        </section>
        <p id="status" class="muted"></p>
      </main>
    </div>
  </div>
  <script type="module">import {loadEBlissTheme} from './theme-loader.js'; await loadEBlissTheme();</script>
  <script src="./app.js"></script>
  <script src="./eb-auth.js"></script>
  <script src="./system-ui.js"></script>
  <script src="./template-dnd.js"></script>
  <script src="./tree-collapse.js"></script>
  <script src="./tree-dnd.js"></script>
  <script>
    (() => {
      const root = document.documentElement, splitter = document.getElementById('treeSplitter');
      const min = 150, max = 520, key = 'eb-tree-width';
      let width = Number(localStorage.getItem(key)) || 220;
      const apply = () => {width = Math.max(min, Math.min(max, width)); root.style.setProperty('--tree-width', width + 'px'); splitter.setAttribute('aria-valuenow', String(width));};
      apply();
      let dragging = false;
      const move = e => {if (!dragging) return; const rect = splitter.getBoundingClientRect(); width = e.clientX - rect.left - 48; apply();};
      splitter.addEventListener('pointerdown', e => {dragging = true; splitter.classList.add('dragging'); splitter.setPointerCapture(e.pointerId); document.body.style.cursor = 'col-resize'; e.preventDefault();});
      splitter.addEventListener('pointermove', move);
      splitter.addEventListener('pointerup', e => {dragging = false; splitter.classList.remove('dragging'); try {splitter.releasePointerCapture(e.pointerId)} catch { }; localStorage.setItem(key, String(width)); document.body.style.cursor = '';});
      splitter.addEventListener('keydown', e => {if (e.key === 'ArrowLeft') {width -= 10; apply(); localStorage.setItem(key, String(width));} if (e.key === 'ArrowRight') {width += 10; apply(); localStorage.setItem(key, String(width));} });
    })();
  </script>
</body>

</html>
